[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssl-reasoner"
version = "0.1.0"
description = "Self-supervised math reasoner with sequence latents and deterministic readout."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
